appId: studio.amanorsac.chordlight88
productName: Chordlight 88
copyright: © 2026 Amanorsac Studio

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - '!**/*.map'

# The About screen tells the user these sit beside the application (B31, B39).
extraFiles:
  - THIRD_PARTY_NOTICES.md
  - LICENSE
  - CHANGELOG.md

# ---------------------------------------------------------------- Windows
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  artifactName: Chordlight-88-${version}-win-${arch}.${ext}
  publisherName: Amanorsac Studio
  # Signing: set WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD in CI.
  # Without them the build is unsigned and SmartScreen will warn on first run.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Chordlight 88
  deleteAppDataOnUninstall: false
  artifactName: Chordlight-88-${version}-Setup.${ext}

portable:
  artifactName: Chordlight-88-${version}-portable.${ext}

# ---------------------------------------------------------------- macOS
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.music
  darkModeSupport: true

  # Signed, notarised and stapled per the macOS Code Signing & Notarisation
  # Standard (proven on SecondOut 1.3.2). The certificates are company-wide;
  # only the product name differs.
  #
  #   identity          Developer ID Application — the notarisable pair. The
  #                     App Store certs cannot notarise and make codesign's
  #                     identity matching ambiguous, so they are never imported.
  #   hardenedRuntime   required for notarisation
  #   entitlements      Electron's JIT needs; never get-task-allow
  #   notarize          electron-builder submits with the App Store Connect API
  #                     key from APPLE_API_KEY / _KEY_ID / _ISSUER and fails the
  #                     build on any status other than Accepted
  #
  # Set identity to false and hardenedRuntime to false for a local unsigned
  # build; CI always signs.
  identity: 'Developer ID Application: Stephen Amanor Sackey (SGQVTNFK4Q)'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  timestamp: http://timestamp.apple.com/ts01
  artifactName: Chordlight-88-${version}-mac.${ext}
  extendInfo:
    NSHumanReadableCopyright: © 2026 Amanorsac Studio
    LSMinimumSystemVersion: '11.0'

dmg:
  title: Chordlight 88 ${version}
  artifactName: Chordlight-88-${version}.${ext}

# ---------------------------------------------------------------- Linux (dev only)
linux:
  target: [AppImage]
  icon: build/icon.png
  category: Audio

# B36 — Amanorsac Hub does installation and updates. This product ships no
# updater and no version check, so no update metadata is published.
publish: null
