appId: studio.amanorsac.chordlight88
productName: Chordlight 88
copyright: © 2026 Amanorsac Studio

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - '!**/*.map'

# The notices ship with the application (B31, B39), but WHERE differs by
# platform. On macOS a plain file dropped into Contents/ is not sealed by the
# code signature, and codesign refuses the whole bundle:
#   "code object is not signed at all — In subcomponent: Contents/CHANGELOG.md"
# Contents/Resources is the signed home for non-code files, which is what
# extraResources gives. On Windows they sit beside the executable.

# ---------------------------------------------------------------- Windows
# Installer & Packaging Standard: one file per platform (P1), named
# <Product>-<version>-Windows.exe with the spaces removed (P28).
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Chordlight88-${version}-Windows.${ext}
  publisherName: Amanorsac Studio
  extraFiles:
    - THIRD_PARTY_NOTICES.md
    - LICENSE
    - CHANGELOG.md
    - README.txt
  # Signing: set WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD in CI.
  # Without them the build is unsigned and SmartScreen will warn on first run.
  signAndEditExecutable: true

# The five-page assisted installer of §5: welcome, licence, components and
# path, progress, done. perMachine puts it in Program Files (§3.1) — the one
# permission prompt, explained on the welcome page (P22). Apps & Features
# registration and a full uninstaller come with it (P23); Documents is never
# touched on uninstall (P25).
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Chordlight 88
  deleteAppDataOnUninstall: false
  artifactName: Chordlight88-${version}-Windows.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  license: build/license.txt
  include: build/installer.nsh

# ---------------------------------------------------------------- macOS
# macOS: a standalone-only product may ship a .dmg holding the .app and
# nothing else (Packaging Standard §1 exception); one file, so no zip.
mac:
  target:
    - target: dmg
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.music
  darkModeSupport: true
  extraResources:
    - THIRD_PARTY_NOTICES.md
    - LICENSE
    - CHANGELOG.md

  # Signed, notarised and stapled per the macOS Code Signing & Notarisation
  # Standard (proven on SecondOut 1.3.2). The certificates are company-wide;
  # only the product name differs.
  #
  #   identity          Developer ID Application — the notarisable pair. The
  #                     App Store certs cannot notarise and make codesign's
  #                     identity matching ambiguous, so they are never imported.
  #   hardenedRuntime   required for notarisation
  #   entitlements      Electron's JIT needs; never get-task-allow
  #   notarize          electron-builder submits with the App Store Connect API
  #                     key from APPLE_API_KEY / _KEY_ID / _ISSUER and fails the
  #                     build on any status other than Accepted
  #
  # Set identity to false and hardenedRuntime to false for a local unsigned
  # build; CI always signs.
  # Name only — electron-builder adds the "Developer ID Application:"
  # prefix itself when it searches the keychain, and rejects a name that
  # already carries one (macCodeSign.js, checkPrefix).
  identity: 'Stephen Amanor Sackey (SGQVTNFK4Q)'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  timestamp: http://timestamp.apple.com/ts01
  artifactName: Chordlight88-${version}-macOS.${ext}
  extendInfo:
    NSHumanReadableCopyright: © 2026 Amanorsac Studio
    LSMinimumSystemVersion: '11.0'
    # Audio inputs (keyboard, vocal) for a clip and the Mix meters. macOS
    # kills an app that opens an input without saying why.
    NSMicrophoneUsageDescription: Chordlight uses your keyboard and vocal inputs for the sound in a video clip, and shows their levels in Advanced › Mix.
    # Bluetooth MIDI keyboards reach the app through CoreMIDI, but macOS
    # still asks on first use of a Bluetooth peripheral.
    NSBluetoothAlwaysUsageDescription: Chordlight lists Bluetooth MIDI keyboards among your MIDI inputs.

dmg:
  title: Chordlight 88 ${version}
  artifactName: Chordlight88-${version}-macOS.${ext}

# ---------------------------------------------------------------- Linux (dev only)
linux:
  target: [AppImage]
  icon: build/icon.png
  category: Audio

# B36 — Amanorsac Hub does installation and updates. This product ships no
# updater and no version check, so no update metadata is published.
publish: null
