appId: studio.amanorsac.chordlight88
productName: Chordlight 88
copyright: © 2026 Amanorsac Studio

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - '!**/*.map'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  artifactName: Chordlight-88-${version}-win-${arch}.${ext}
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Chordlight 88
  deleteAppDataOnUninstall: false
  artifactName: Chordlight-88-${version}-Setup.${ext}

portable:
  artifactName: Chordlight-88-${version}-portable.${ext}

mac:
  target:
    - target: zip
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.music
  darkModeSupport: true
  hardenedRuntime: false
  identity: null
  gatekeeperAssess: false
  artifactName: Chordlight-88-${version}-mac.${ext}
  extendInfo:
    NSHumanReadableCopyright: © 2026 Amanorsac Studio
    LSMinimumSystemVersion: '11.0'

linux:
  target: [AppImage]
  icon: build/icon.png
  category: Audio
