name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            script: dist:win
          - os: macos-latest
            label: macOS disk image
            script: dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare notarisation key
        if: runner.os == 'macOS'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_P8 is empty. If the org secret's visibility is 'Private repositories' it resolves empty on a public repo and signing silently skips."
            exit 1
          fi
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/asc.p8"
          fi
          test -s "$RUNNER_TEMP/asc.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: Check the signing secrets are present
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          PW: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "::error::MAC_CERT_P12 is empty."; exit 1; }
          [ -n "$PW" ]  || { echo "::error::MAC_CERT_PASSWORD is empty."; exit 1; }
          echo "Developer ID Application certificate and password present."

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CSC_FOR_PULL_REQUEST: false
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.script }}

      - name: Verify signature, hardened runtime and staple
        if: runner.os == 'macOS'
        run: |
          APP=$(find dist -maxdepth 2 -name '*.app' -print -quit)
          echo "Checking $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo '::error::hardened runtime missing'; exit 1; }
          codesign --display --verbose=4 "$APP" 2>&1 | grep -q '^Timestamp=' \
            || { echo '::error::secure timestamp missing'; exit 1; }
          if codesign --display --entitlements - --xml "$APP" | grep -q 'get-task-allow'; then
            echo '::error::get-task-allow present — Apple will reject this'; exit 1
          fi
          DMG=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          xcrun stapler validate "$DMG"
          spctl --assess -vv --type open --context context:primary-signature "$DMG"
          echo "Signed, notarised, stapled, and Gatekeeper-approved."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chordlight-${{ runner.os }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
