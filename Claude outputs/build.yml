name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Three quick pushes should not leave three full builds running — macOS
# runners bill about 6x Windows (macOS Signing Standard §6).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            script: dist:win
          - os: macos-latest
            label: macOS disk image
            script: dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------------- macOS
      # The App Store Connect API key has to be a file on disk for notarytool.
      # Secrets hold contents, never filenames (Signing Standard §3), and the
      # paste form adds a trailing newline, so everything is trimmed.
      - name: Prepare notarisation key
        if: runner.os == 'macOS'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_P8 is empty. If the org secret's visibility is 'Private repositories' it resolves empty on a public repo and signing silently skips (Signing Standard §5)."
            exit 1
          fi
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"        # raw text
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/asc.p8"
          fi
          test -s "$RUNNER_TEMP/asc.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      # The keychain is built here rather than left to electron-builder.
      # electron-builder creates its keychain with a random password but then
      # calls `security set-key-partition-list -k <p12 password>`, and leaves
      # the keychain on the default 300-second lock timeout. A universal build
      # outlives that, the keychain relocks, and the p12 password cannot unlock
      # it — "SecKeychainUnlock: The user name or passphrase you entered is not
      # correct". Owning the keychain ourselves keeps one password for the
      # keychain and a long timeout.
      #
      # `security` reports a wrong password, a blob that is not a .p12, and a
      # paste that carried a trailing newline with the same sentence, so the
      # file is inspected first and the password is tried as given, trimmed and
      # empty. Nothing secret is printed — only which of the three worked.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          [ -n "$MAC_CERT_P12" ]      || { echo "::error::MAC_CERT_P12 is empty."; exit 1; }
          [ -n "$MAC_CERT_PASSWORD" ] || { echo "::error::MAC_CERT_PASSWORD is empty."; exit 1; }

          P12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MAC_CERT_P12" | tr -d '[:space:]' | base64 --decode > "$P12" 2>/dev/null || true

          if [ ! -s "$P12" ]; then
            echo "::error::MAC_CERT_P12 is not valid base64. The secret must be the base64 of the .p12 file's bytes — on a Mac: base64 -i cert.p12 | pbcopy"
            exit 1
          fi

          MAGIC="$(od -An -tx1 -N2 "$P12" | tr -d ' \n')"
          echo "Decoded certificate: $(wc -c < "$P12" | tr -d ' ') bytes, first bytes $MAGIC (a .p12 begins 3082)"
          if [ "${MAGIC%??}" != "30" ]; then
            echo "::error::Those bytes are not a PKCS#12 file. This looks like a .cer, .pem or text file rather than a .p12 exported with its private key — or the base64 was taken of the wrong file."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/chordlight-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -t 21600 -u "$KEYCHAIN"      # 6h, no relock mid-build
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          # security is the authority on whether the password opens the file, so
          # it does the trying; openssl only gets a say in the error message.
          TRIMMED="$(printf '%s' "$MAC_CERT_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          FOUND=""
          for CANDIDATE in "as given:$MAC_CERT_PASSWORD" "with surrounding whitespace removed:$TRIMMED" "empty:"; do
            LABEL="${CANDIDATE%%:*}"
            VALUE="${CANDIDATE#*:}"
            if security import "$P12" -k "$KEYCHAIN" -P "$VALUE" -f pkcs12 \
                 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild > /dev/null 2>&1; then
              FOUND="$LABEL"; break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "::error::MAC_CERT_PASSWORD does not open this .p12 — rejected as given, trimmed, and empty. Re-export the certificate (Keychain Access: right-click the Developer ID Application certificate with its private key under it, Export, .p12, type a password), then update BOTH secrets — MAC_CERT_P12 with the new base64 and MAC_CERT_PASSWORD with the password you just typed. Signing Standard section 2."
            exit 1
          fi
          echo "Certificate imported; password accepted $FOUND."
          rm -f "$P12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Proves the private key came across with the certificate. The
          # identity line is not a secret.
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Developer ID Application' \
            || { echo "::error::The .p12 opened but holds no Developer ID Application signing identity. Re-export it WITH its private key — in Keychain Access the certificate must show a key under its disclosure triangle — and check it is a Developer ID Application certificate, not an Apple Development or App Store one."; exit 1; }

      # --------------------------------------------------------------- build
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Windows Authenticode — optional until the certificate exists.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

          # No CSC_LINK / CSC_KEY_PASSWORD on macOS: with those set,
          # electron-builder builds its own keychain and hits the relock bug
          # above. The identity imported in the previous step is in the user
          # keychain search list, which is where electron-builder looks next.
          CSC_FOR_PULL_REQUEST: false

          # Notarisation. APPLE_API_KEY is set by the step above.
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.script }}

      # ------------------------------------------------------- verify macOS
      # electron-builder fails the build on a bad notarisation, but the
      # standard's §4 checks are cheap and catch the silent cases.
      - name: Verify signature, hardened runtime and staple
        if: runner.os == 'macOS'
        run: |
          APP=$(find dist -maxdepth 2 -name '*.app' -print -quit)
          echo "Checking $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo '::error::hardened runtime missing'; exit 1; }
          codesign --display --verbose=4 "$APP" 2>&1 | grep -q '^Timestamp=' \
            || { echo '::error::secure timestamp missing'; exit 1; }
          if codesign --display --entitlements - --xml "$APP" | grep -q 'get-task-allow'; then
            echo '::error::get-task-allow present — Apple will reject this'; exit 1
          fi
          DMG=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          xcrun stapler validate "$DMG"
          spctl --assess -vv --type open --context context:primary-signature "$DMG"
          echo "Signed, notarised, stapled, and Gatekeeper-approved."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chordlight-${{ runner.os }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
